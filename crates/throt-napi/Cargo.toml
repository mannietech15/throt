[package]
name = "throt-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NAPI-RS native bindings for THROT distributed rate-limiting engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2.16"
throt-core = { workspace = true }
throt-algorithms = { workspace = true }
throt-storage = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2.1"
