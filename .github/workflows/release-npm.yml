name: Release npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-native:
    name: Build Native - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: throt.linux-x64-gnu.node
            package_dir: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: throt.linux-arm64-gnu.node
            package_dir: linux-arm64-gnu
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: throt.darwin-x64.node
            package_dir: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: throt.darwin-arm64.node
            package_dir: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: throt.win32-x64-msvc.node
            package_dir: win32-x64-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install aarch64 cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build target
        run: cargo build -p throt-napi --release --target ${{ matrix.target }}

      - name: Package native binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/throt_napi.dll artifacts/${{ matrix.artifact }}
          elif [[ "${{ matrix.os }}" == "macos-13" || "${{ matrix.os }}" == "macos-latest" ]]; then
            cp target/${{ matrix.target }}/release/libthrot_napi.dylib artifacts/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/libthrot_napi.so artifacts/${{ matrix.artifact }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: artifacts/${{ matrix.artifact }}

  publish-npm:
    name: Publish to npm
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-artifacts

      - name: Prepare and Publish Platform Packages First
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Releasing THROT version ${RELEASE_VERSION}..."

          PLATFORMS=("linux-x64-gnu" "linux-arm64-gnu" "darwin-x64" "darwin-arm64" "win32-x64-msvc")

          for platform in "${PLATFORMS[@]}"; do
            echo "Packaging npm/$platform..."
            if [ ! -d "npm-artifacts/$platform" ]; then
              echo "Error: Missing artifact for platform $platform"
              exit 1
            fi
            
            cp npm-artifacts/"$platform"/* "npm/$platform/"
            
            # Update version in platform package.json
            node -e "
              const fs = require('fs');
              const path = 'npm/$platform/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.version = '$RELEASE_VERSION';
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            "
            
            echo "Publishing @throt/node-$platform..."
            npm publish "npm/$platform" --access public --provenance
          done

      - name: Publish Main @throt/node Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          
          # Update version and optionalDependencies in packages/node/package.json
          node -e "
            const fs = require('fs');
            const path = 'packages/node/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$RELEASE_VERSION';
            for (const key of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[key] = '$RELEASE_VERSION';
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          
          echo "Publishing main @throt/node wrapper package..."
          npm publish packages/node --access public --provenance

