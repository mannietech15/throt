name: Release npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    name: Build Native - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: throt.linux-x64-gnu.node
            package_dir: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: throt.linux-arm64-gnu.node
            package_dir: linux-arm64-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: throt.darwin-x64.node
            package_dir: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: throt.darwin-arm64.node
            package_dir: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: throt.win32-x64-msvc.node
            package_dir: win32-x64-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install aarch64 cross-compiler (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build target
        run: cargo build -p throt-napi --release --target ${{ matrix.target }}

      - name: Package native binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/throt_napi.dll artifacts/${{ matrix.artifact }}
          elif [[ "${{ matrix.os }}" == "macos-13" || "${{ matrix.os }}" == "macos-latest" ]]; then
            cp target/${{ matrix.target }}/release/libthrot_napi.dylib artifacts/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/libthrot_napi.so artifacts/${{ matrix.artifact }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: artifacts/${{ matrix.artifact }}

  publish-npm:
    name: Publish to npm
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-artifacts

      - name: Determine Distribution Tag & Validate Release Tag
        id: release_meta
        run: |
          set -e
          RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Evaluating release tag: v${RELEASE_VERSION}"

          # Strict SemVer validation: X.Y.Z or X.Y.Z-<prerelease>
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag 'v${RELEASE_VERSION}' is not a valid Semantic Version (expected X.Y.Z or X.Y.Z-prerelease)."
            exit 1
          fi

          if [[ "$RELEASE_VERSION" =~ - ]]; then
            DIST_TAG="next"
            echo "Prerelease identifier detected in '${RELEASE_VERSION}'. Using npm tag: next (protecting @latest)."
          else
            DIST_TAG="latest"
            echo "Stable version detected in '${RELEASE_VERSION}'. Using npm tag: latest."
          fi

          echo "release_version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "dist_tag=${DIST_TAG}" >> $GITHUB_OUTPUT

      - name: Prepare and Publish Platform Packages First
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.release_version }}
          DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
        run: |
          set -e
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set in repository secrets."
            exit 1
          fi

          echo "Publishing THROT native platform packages for version ${RELEASE_VERSION} under tag ${DIST_TAG}..."

          PLATFORMS=("linux-x64-gnu" "linux-arm64-gnu" "darwin-x64" "darwin-arm64" "win32-x64-msvc")

          for platform in "${PLATFORMS[@]}"; do
            echo "Preparing npm/$platform..."
            if [ ! -d "npm-artifacts/$platform" ]; then
              echo "::error::Missing build artifact for platform $platform"
              exit 1
            fi
            
            cp npm-artifacts/"$platform"/* "npm/$platform/"
            
            # Sync and verify version in platform package.json
            node -e "
              const fs = require('fs');
              const path = 'npm/$platform/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.version = process.env.RELEASE_VERSION;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              const updated = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (updated.version !== process.env.RELEASE_VERSION) {
                console.error('Failed to sync version for ' + path);
                process.exit(1);
              }
            "
            
            echo "Publishing @throt/node-$platform@${RELEASE_VERSION} (--tag ${DIST_TAG})..."
            npm publish "npm/$platform" --access public --tag "${DIST_TAG}"
          done

      - name: Publish Main @throt/node Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.release_version }}
          DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
        run: |
          set -e
          echo "Publishing main @throt/node wrapper package for version ${RELEASE_VERSION} under tag ${DIST_TAG}..."
          
          # Sync and verify version and optionalDependencies in packages/node/package.json
          node -e "
            const fs = require('fs');
            const path = 'packages/node/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const targetVersion = process.env.RELEASE_VERSION;
            pkg.version = targetVersion;
            if (!pkg.optionalDependencies || Object.keys(pkg.optionalDependencies).length === 0) {
              console.error('No optionalDependencies defined in ' + path);
              process.exit(1);
            }
            for (const key of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[key] = targetVersion;
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            
            const updated = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (updated.version !== targetVersion) {
              console.error('Version mismatch in wrapper package');
              process.exit(1);
            }
            for (const [key, val] of Object.entries(updated.optionalDependencies)) {
              if (val !== targetVersion) {
                console.error('optionalDependency mismatch for ' + key + ': expected ' + targetVersion + ', found ' + val);
                process.exit(1);
              }
            }
            console.log('All wrapper dependencies successfully aligned to ' + targetVersion);
          "
          
          npm publish packages/node --access public --tag "${DIST_TAG}"

